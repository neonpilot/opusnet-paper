name: crypto-paper-aggr
# Paper account #3, AGGRESSIVE: TOP-2 MOMENTUM (mom_top2_1x). SIMULATED MONEY, REAL PRICES (Binance public
# klines via data-api.binance.vision, keyless). No exchange keys exist; no real orders are ever sent.
# Twice an hour (:19 and :49; GitHub cron is best-effort and sometimes skips runs, and a step is idempotent)
# it books the newly completed 1h candles into the separate ledger in crypto/state_aggr/ on the `crypto-state`
# branch: fills at the first hourly open after the order was created, daily decision after the 00:00 UTC close,
# hard stop only at -60% from peak. It never pushes to main. Manual run: workflow_dispatch (init=true opens
# the account once; it refuses if the account already exists).
on:
  schedule:
    - cron: "19 * * * *"
    - cron: "49 * * * *"
  workflow_dispatch:
    inputs:
      init:
        description: "Open the account ($1,000 simulated) - refuses if it already exists"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: crypto-paper-aggr
  cancel-in-progress: false
jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: code
          fetch-depth: 1
      - name: Checkout ledger state (crypto-state)
        uses: actions/checkout@v4
        with:
          ref: crypto-state
          path: state
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: code/crypto_engine/requirements.txt
      - run: pip install -r code/crypto_engine/requirements.txt
      - name: Paper step (idempotent)
        working-directory: code
        env:
          INIT: ${{ github.event_name == 'workflow_dispatch' && inputs.init && '--init' || '' }}
        run: python -m crypto_engine.aggr_step --state-dir "$GITHUB_WORKSPACE/state/crypto/state_aggr" $INIT
      - name: Commit + push state (rebase and retry)
        working-directory: state
        run: |
          git config user.name "opusnet-crypto-bot"
          git config user.email "opusnet-crypto-bot@users.noreply.github.com"
          git add -A crypto/state_aggr
          if git diff --cached --quiet; then echo "no new candle -> nothing to commit"; exit 0; fi
          git commit -qm "crypto aggr paper step $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5 6; do
            if git push origin HEAD:crypto-state; then exit 0; fi
            git pull --rebase origin crypto-state || { echo "rebase conflict"; exit 1; }
            sleep $((i * 5))
          done
          exit 1
