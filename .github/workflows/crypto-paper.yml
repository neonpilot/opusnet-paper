name: crypto-paper
# OPUSNET-CRYPTO 24/7 *paper* account. SIMULATED MONEY, REAL PRICES (Binance public klines via
# data-api.binance.vision, keyless). No exchange keys exist; no real orders are ever sent.
# Every hour at :17 it books the newly completed 1h candles into the paper ledger (fills at the next
# hourly open, kill switch checked every candle, daily decision after the 00:00 UTC close) and appends
# the ledger/journal/live.json to crypto/state/ on the `crypto-state` branch (append-only history).
# It never pushes to main, so it cannot clash with the daily stock routine and triggers no Pages build.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: crypto-paper
  cancel-in-progress: false
jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: code
          fetch-depth: 1
      - name: Checkout ledger state (crypto-state)
        uses: actions/checkout@v4
        with:
          ref: crypto-state
          path: state
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: code/crypto_engine/requirements.txt
      - run: pip install -r code/crypto_engine/requirements.txt
      - name: Paper step (idempotent)
        working-directory: code
        run: python -m crypto_engine.paper_step --state-dir "$GITHUB_WORKSPACE/state/crypto/state"
      - name: Commit + push state (rebase and retry)
        working-directory: state
        run: |
          git config user.name "opusnet-crypto-bot"
          git config user.email "opusnet-crypto-bot@users.noreply.github.com"
          git add -A crypto/state
          if git diff --cached --quiet; then echo "no new candle -> nothing to commit"; exit 0; fi
          git commit -qm "crypto paper step $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:crypto-state; then exit 0; fi
            git pull --rebase origin crypto-state || { echo "rebase conflict"; exit 1; }
            sleep $((i * 5))
          done
          exit 1
